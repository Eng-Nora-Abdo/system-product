<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>prodect</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    
    <h1 class="text-center bg-primary py-3 text-white" >Shop System</h1>
       
      <div class="container py-5">
        <div class="form-group mb-3">
            <label class="py-3" for="productName">Product Name</label>
            <input type="text" id="productName" class="form-control">
        </div>

        <div class="form-group mb-3">
            <label class="py-3" for="productPrice">Product Price</label>
            <input type="number" id="productPrice" class="form-control">
        </div>

        <div class="form-group mb-3">
            <label class="py-3" for="productCategory">Product Category</label>
            <input type="text" id="productCategory" class="form-control">
        </div>

        <div class="form-group mb-3">
            <label class="py-3" for="productDesc">Product Desc</label>
            <textarea type="text" id="productDesc" class="form-control"></textarea>
        </div>
        <button id="mainBtn" class="btn btn-primary" onclick="addProduct()">Add Product</button>
      </div> 
      
      <div class="container">
        <input type="text" onkeyup="searchProduct(this.value)" placeholder="search......." class="form-control w-75 mx-auto mb-3">
    <div class="table-responsive">    
        <table class="table table-striped text-center">
            <thead>
                <th>index</th>
                <th>productName</th>
                <th>productPrice</th>
                <th>productCategory</th>
                <th>productDescription</th>
                <th>update</th>
                <th>delete</th>
            </thead>

            <tbody id="tableBody"></tbody>
        </table>
    </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
